---
products:
  pextra-ce-ose-amd64:
    distri: "pextra-ce"
    flavor: "ose"
    arch: "amd64"
    version: "1.0"
  pextra-ce-ose-arm64:
    distri: "pextra-ce"
    flavor: "ose"
    arch: "arm64"
    version: "1.0"

machines:
  amd64:
    backend: qemu
    settings:
      WORKER_CLASS: qemu_x86_64
  arm64:
    backend: qemu
    settings:
      WORKER_CLASS: qemu_aarch64

scenarios:
  amd64:
    pextra-ce-ose-1.0-amd64:
      machine: amd64
      priority: 50


job_templates:
  eula:
    product: "local"
    machine: "amd64"
